<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes"/>
    <title>Your Storybook - AI Storybook</title>
    <link rel="icon" type="image/svg+xml" href="/public/favicon.svg">
    <style>
      * {
        box-sizing: border-box;
      }
      body {
        background: #111;
        color: #eaff6b;
        font-family: 'Inter', Arial, sans-serif;
        margin: 0;
        padding: 0;
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: flex-start;
        padding: 20px;
        overflow-x: hidden;
      }
      .container {
        width: 100%;
        max-width: 900px;
        margin: 0 auto;
        display: flex;
        flex-direction: column;
        align-items: center;
      }
      .header {
        text-align: center;
        margin-bottom: 30px;
      }
      .back-btn {
        background: #222;
        color: #eaff6b;
        border: 1px solid #444;
        border-radius: 8px;
        padding: 10px 20px;
        font-size: 0.9rem;
        cursor: pointer;
        text-decoration: none;
        display: inline-block;
        margin-bottom: 20px;
        transition: background 0.2s;
      }
      .back-btn:hover {
        background: #2a2a2a;
      }
      .title {
        font-size: 2rem;
        font-weight: 700;
        color: #eaff6b;
        margin-bottom: 10px;
      }
      .subtitle {
        font-size: 1rem;
        color: #999;
        margin-bottom: 20px;
      }
      .loading {
        text-align: center;
        padding: 60px 20px;
      }
      .spinner {
        border: 4px solid #333;
        border-top: 4px solid #eaff6b;
        border-radius: 50%;
        width: 50px;
        height: 50px;
        animation: spin 1s linear infinite;
        margin: 0 auto 20px;
      }
      @keyframes spin {
        0% { transform: rotate(0deg); }
        100% { transform: rotate(360deg); }
      }
      .error-message {
        background: rgba(241, 91, 181, 0.2);
        color: #f15bb5;
        border: 1px solid #f15bb5;
        border-radius: 12px;
        padding: 20px;
        text-align: center;
        margin: 20px 0;
      }
      .pdf-container {
        width: 100%;
        display: none;
        flex-direction: column;
        gap: 20px;
        margin-bottom: 20px;
      }
      .pdf-container.loaded {
        display: flex;
      }
      .pdf-page {
        width: 100%;
        background: #fff;
        border-radius: 12px;
        overflow: hidden;
        box-shadow: 0 10px 40px rgba(0, 0, 0, 0.5);
      }
      .pdf-page canvas {
        width: 100%;
        height: auto;
        display: block;
      }
      .pdf-page img {
        width: 100%;
        height: auto;
        display: block;
      }
      .pdf-embed {
        width: 100%;
        min-height: 600px;
        border: none;
        border-radius: 12px;
        background: #fff;
      }
      .download-btn {
        width: 100%;
        max-width: 400px;
        background: linear-gradient(135deg, #7f5af0 0%, #f15bb5 100%);
        color: #fff;
        border: none;
        border-radius: 12px;
        padding: 16px;
        font-size: 1.1rem;
        font-weight: 600;
        margin-top: 20px;
        cursor: pointer;
        transition: transform 0.2s;
        text-decoration: none;
        display: inline-block;
        text-align: center;
      }
      .download-btn:hover {
        transform: translateY(-2px);
      }
      /* QR code badge */
      .qr-badge {
        position: fixed;
        right: 24px;
        bottom: 24px;
        width: 110px;
        height: 110px;
        border-radius: 12px;
        object-fit: cover;
        box-shadow: 0 8px 30px rgba(0,0,0,0.6);
        border: 2px solid rgba(234,255,107,0.12);
        background: #111;
        z-index: 1200;
      }
      @media (max-width: 768px) {
        .title {
          font-size: 1.5rem;
        }
        body {
          padding: 10px;
        }
        .container {
          padding: 0;
        }
        .qr-badge {
          width: 68px;
          height: 68px;
          right: 10px;
          bottom: 10px;
        }
      }
    </style>
  </head>
  <body>
    <div class="container">
      <div class="header">
        <a href="/" class="back-btn">← Back to Home</a>
        <h1 class="title">Your Storybook is Ready! 🎉</h1>
        <p class="subtitle">Here's your personalized AI-generated storybook</p>
      </div>

      <div id="loading" class="loading">
        <div class="spinner"></div>
        <p style="color: #999;">Loading your storybook...</p>
      </div>

      <div id="error" class="error-message" style="display: none;">
        <h3>Oops! Something went wrong</h3>
        <p id="error-text"></p>
      </div>

      <div id="pdf-container" class="pdf-container">
        <!-- PDF pages will be rendered here as canvases -->
      </div>

      <a id="download-btn" class="download-btn" style="display: none;" download>
        📥 Download PDF
      </a>
    </div>

    <!-- PDF.js library -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
    <script>
      // Check if PDF.js loaded
      if (typeof pdfjsLib === 'undefined') {
        console.error('PDF.js failed to load');
        showError('Failed to load PDF library. Please refresh the page.');
      } else {
        // Configure PDF.js worker
        pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
      }

      // Get URL parameters
      const urlParams = new URLSearchParams(window.location.search);
      const style = urlParams.get('style') || 'manga';
      const photo = urlParams.get('photo') || 'hesdi';

      // Direct Firebase Storage URL
      const pdfUrl = 'https://firebasestorage.googleapis.com/v0/b/photo-ai-test-1.firebasestorage.app/o/demo%2Fmanga%2Fhesdi.pdf?alt=media&token=13c05544-8fdf-4420-9e7c-0b924cf612a2';

      // Function to render a single page
      async function renderPage(pdf, pageNumber, container) {
        try {
          const page = await pdf.getPage(pageNumber);
          
          // Calculate scale to fit container width
          const viewport = page.getViewport({ scale: 1 });
          const containerWidth = container.offsetWidth || 900;
          
          // Use lower resolution on mobile devices for faster rendering
          const isMobile = window.innerWidth <= 768;
          const maxScale = isMobile ? 1.0 : 2;
          const scale = Math.min(maxScale, containerWidth / viewport.width);
          const scaledViewport = page.getViewport({ scale: scale });

          // Create canvas
          const canvas = document.createElement('canvas');
          const context = canvas.getContext('2d');
          canvas.height = scaledViewport.height;
          canvas.width = scaledViewport.width;

          // Create page wrapper
          const pageDiv = document.createElement('div');
          pageDiv.className = 'pdf-page';
          pageDiv.appendChild(canvas);
          container.appendChild(pageDiv);

          // Render page
          const renderContext = {
            canvasContext: context,
            viewport: scaledViewport
          };
          
          await page.render(renderContext).promise;
          console.log(`Rendered page ${pageNumber}`);
        } catch (error) {
          console.error(`Error rendering page ${pageNumber}:`, error);
          throw error;
        }
      }

      // Function to load and render all pages
      async function loadPDF() {
        try {
          console.log('Starting PDF load...');
          document.getElementById('loading').style.display = 'block';
          
          // Check if PDF.js is available
          if (typeof pdfjsLib === 'undefined') {
            console.warn('PDF.js not available, using fallback embed');
            useFallbackEmbed();
            return;
          }

          console.log('Loading PDF from:', pdfUrl);
          
          // Load PDF with CORS mode
          const loadingTask = pdfjsLib.getDocument({
            url: pdfUrl,
            withCredentials: false
          });
          
          const pdf = await loadingTask.promise;
          console.log('PDF loaded, pages:', pdf.numPages);
          
          const container = document.getElementById('pdf-container');
          const numPages = pdf.numPages;

          // Render all pages
          for (let pageNum = 1; pageNum <= numPages; pageNum++) {
            await renderPage(pdf, pageNum, container);
          }

          console.log('All pages rendered');

          // Show PDF container and hide loading
          container.classList.add('loaded');
          document.getElementById('loading').style.display = 'none';

          // Setup download button
          const downloadBtn = document.getElementById('download-btn');
          downloadBtn.href = pdfUrl;
          downloadBtn.style.display = 'inline-block';

        } catch (error) {
          console.error('Error loading PDF with PDF.js:', error);
          console.log('Falling back to embed');
          useFallbackEmbed();
        }
      }

      // Fallback: Use Google Docs Viewer or direct embed
      function useFallbackEmbed() {
        const container = document.getElementById('pdf-container');
        container.innerHTML = '';
        
        // Create iframe with Google Docs Viewer
        const iframe = document.createElement('iframe');
        iframe.className = 'pdf-embed';
        iframe.src = `https://docs.google.com/viewer?url=${encodeURIComponent(pdfUrl)}&embedded=true`;
        iframe.style.width = '100%';
        iframe.style.height = '800px';
        
        container.appendChild(iframe);
        container.classList.add('loaded');
        document.getElementById('loading').style.display = 'none';

        // Setup download button
        const downloadBtn = document.getElementById('download-btn');
        downloadBtn.href = pdfUrl;
        downloadBtn.style.display = 'inline-block';
      }

      function showError(message) {
        document.getElementById('loading').style.display = 'none';
        document.getElementById('error').style.display = 'block';
        document.getElementById('error-text').textContent = message;
      }

      // Load PDF on page load
      if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', loadPDF);
      } else {
        loadPDF();
      }
    </script>
  </body>
  <!-- QR code badge (public asset) -->
  <img src="/public/qr_code.png" alt="QR Code" class="qr-badge" />
</html>
