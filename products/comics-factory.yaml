  long_term: "6–24 mo: style marketplace, exports, publisher API pilots; visual-novel builder, early video/animatics"
  outcomes:
    y1: "~1,500 paying creators, ~5 publisher pilots, ARR ~$300k"
    y2: "~6,000/15, ~$1.6M"
    y3: "~20,000/40, ~$6M"
